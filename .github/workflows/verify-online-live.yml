name: Verify live RUNIVERSE accounts HTTPS health
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-online-live.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check database-backed health over HTTPS
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            code=$(curl -sS -L -m 25 -o /tmp/health.json -w '%{http_code}' https://runiverse-accounts-api.onrender.com/health || true)
            echo "Attempt $attempt: status=$code body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && python3 -c 'import json; x=json.load(open("/tmp/health.json")); assert x.get("ok") is True and x.get("db")=="connected"'; then
              echo 'RUNIVERSE LIVE DATABASE VERIFIED'
              exit 0
            fi
            sleep 8
          done
          echo 'RUNIVERSE DATABASE UNAVAILABLE' >&2
          exit 1
      - name: Check authentication endpoint requires a session
        run: |
          set -euo pipefail
          status=$(curl -sS -m 25 -o /tmp/profile.json -w '%{http_code}' https://runiverse-accounts-api.onrender.com/api/profile)
          echo "profile status=$status"
          cat /tmp/profile.json
          test "$status" = 401
