name: Prepare local Godot validation binary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-godot-linux.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download stable Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip \
          https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p godot
          unzip -q /tmp/godot.zip -d godot/
          chmod +x godot/*
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-4.7.2-Linux-for-validation
          path: godot/
          retention-days: 1
