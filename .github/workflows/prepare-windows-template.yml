name: Prepare Windows export template
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-windows-template.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download official templates and select Windows x86_64 release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p windows-template
          unzip -p /tmp/templates.tpz templates/windows_release_x86_64.exe > windows-template/windows_release_x86_64.exe
          test -s windows-template/windows_release_x86_64.exe
          ls -lh windows-template
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-4.7.2-Windows-release-template
          path: windows-template/
          retention-days: 1
