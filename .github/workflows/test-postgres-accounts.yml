name: Test RUNIVERSE PostgreSQL accounts
on:
  workflow_dispatch:
  push:
    paths:
      - 'online/server/**'
      - '.github/workflows/test-postgres-accounts.yml'
permissions:
  contents: read
jobs:
  postgres-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runiverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/runiverse_test
    defaults:
      run:
        working-directory: online/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check index_pg.js
      - run: node --test postgres.integration.test.js
